name: Risk
description: Identify and manage a risk or opportunity affecting quality or delivery
title: "[RISK] "
labels: ["type:risk"]
body:
  - type: markdown
    attributes:
      value: |
        ## Risk Identification
        Use this issue to record a risk...

  - type: textarea
    id: description
    attributes:
      label: Risk Description
      description: Provide a description of the risk, what could go wrong?
      placeholder: Describe the risk in plain language.
    validations:
      required: true

  - type: textarea
    id: affected
    attributes:
      label: Affected Area
      description: |
        What could the impact of the risk be, for example unsuccessful trial, hardware requires
        redesign, schedule impact or cost impact. Where possible specify what will be impacted, and provide
        an estimate for any cost or schedule impact.
      placeholder: |
        - Product / system:
        - Part / assembly / software component:
        - Project or release:
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity of Impact
      description: What would be the impact if the risk materialised?
      options:
        - Minor
        - Moderate
        - Major
        - Critical
    validations:
      required: true

  - type: dropdown
    id: likelihood
    attributes:
      label: Likelihood
      description: How likely is this risk to occur?
      options:
        - Low
        - Medium
        - High
    validations:
      required: true

  - type: textarea
    id: mitigation
    attributes:
      label: Mitigation / Treatment Plan
      description: What actions are planned to reduce, manage, or accept this risk?
      placeholder: |
        Examples:
        - Design change
        - Additional verification
        - Supplier clarification
        - Schedule buffer
        - Explicit risk acceptance
    validations:
      required: false

  - type: input
    id: owner
    attributes:
      label: Risk Owner
      description: Who is responsible for monitoring and managing this risk?
      placeholder: Name or role
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Risk Status
      options:
        - Open
        - Mitigation in progress
        - Mitigated
        - Accepted
        - Closed
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: Related Items
      description: Link related artefacts where applicable.
      placeholder: |
        - Requirement:
        - Feature / Task:
        - Verification:
        - Nonconformance:
        - Release:
    validations:
      required: false
